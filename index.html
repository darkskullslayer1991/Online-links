<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0805">
<title>The Vault | Private Collection</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120b07'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23E0A458'/%3E%3Ccircle cx='16' cy='16' r='8.6' fill='%231b110a'/%3E%3Ccircle cx='16' cy='14.2' r='2.6' fill='%23E0A458'/%3E%3Cpath d='M14.7 15.6h2.6l1 5h-4.6z' fill='%23E0A458'/%3E%3Cg fill='%231b110a'%3E%3Ccircle cx='16' cy='5.8' r='.9'/%3E%3Ccircle cx='16' cy='26.2' r='.9'/%3E%3Ccircle cx='5.8' cy='16' r='.9'/%3E%3Ccircle cx='26.2' cy='16' r='.9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0805;--surface:rgba(32,21,14,.72);
  --brass:#E0A458;--brass-light:#F6D9A8;--copper:#B8693A;--brass-muted:rgba(224,164,88,.4);--glow:rgba(224,164,88,.18);
  --text:#F4EADD;--dim:#A8977F;--border:rgba(255,225,180,.12);
  --serif:'Fraunces',serif;--sans:'DM Sans',sans-serif;--ease:cubic-bezier(.4,0,.2,1);
  --metal:linear-gradient(180deg,#F6D9A8,#E0A458 45%,#9C6A2E);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);color:var(--text);scrollbar-gutter:stable}
body{margin:0;font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--brass);color:var(--bg)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brass-muted);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--brass)}
button{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#bg,.glow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#bg{z-index:0}
.glow{z-index:1;background:radial-gradient(ellipse 70% 45% at 50% 0,rgba(224,164,88,.14),transparent),radial-gradient(circle at center,transparent 20%,rgba(10,6,3,.9) 100%)}
.app{position:relative;z-index:10}

nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(13,8,5,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1600px;margin:0 auto;padding:14px 40px}
.logo{font:600 22px var(--serif);color:var(--brass);text-decoration:none;display:flex;align-items:center;gap:12px;width:max-content}
.logo svg{width:28px;height:28px;filter:drop-shadow(0 0 8px var(--glow))}

.hero{position:relative;overflow:hidden;height:60vh;min-height:440px;display:flex;justify-content:center;align-items:center;text-align:center}
.wheel{position:absolute;left:50%;top:50%;width:min(680px,100vw);aspect-ratio:1;margin:calc(min(680px,100vw)/-2) 0 0 calc(min(680px,100vw)/-2);opacity:.3;fill:none;stroke:var(--brass);will-change:transform}
.hero-content{position:relative;padding:0 20px;animation:up 1.2s var(--ease) both}
.hero-title{font:500 clamp(40px,7vw,84px)/1.05 var(--serif);margin:0;letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,0,0,.85)}
.hero-sub{margin:18px auto 0;max-width:34ch;color:var(--brass-light);font:italic 400 18px/1.5 var(--serif);text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hero-stats{display:flex;gap:44px;justify-content:center;margin:36px auto 0}
.stat{display:flex;flex-direction:column;align-items:center}
.stat b{font:500 28px var(--serif);color:var(--brass)}
.stat span{font-size:13px;color:var(--dim)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}

/* brass rail with bolted ends */
.rail{height:10px;margin:0 max(20px,calc(50% - 780px));border-radius:5px;background:
  radial-gradient(circle at 10px 5px,#3a2616 0 2px,transparent 2.5px),radial-gradient(circle at calc(100% - 10px) 5px,#3a2616 0 2px,transparent 2.5px),
  linear-gradient(180deg,#F6D9A8,#E0A458 40%,#8a5a26);box-shadow:0 2px 16px var(--glow),0 -1px 0 rgba(255,255,255,.15) inset}

.utility{max-width:1600px;margin:0 auto;padding:36px 40px 20px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;position:sticky;top:61px;z-index:90;background:rgba(13,8,5,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.utility::after{content:"";position:absolute;left:40px;right:40px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--brass-muted),transparent)}
.search{position:relative;width:100%;max-width:400px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);fill:none;transition:stroke .4s}
.search:focus-within svg{stroke:var(--brass)}
#search{width:100%;background:rgba(28,18,11,.85);border:1px solid var(--border);color:var(--text);font:14px var(--sans);padding:12px 16px 12px 44px;border-radius:6px;transition:all .4s var(--ease)}
#search:focus{outline:0;border-color:var(--brass);box-shadow:0 0 16px var(--glow)}
#search::placeholder{color:var(--dim)}

.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:rgba(28,18,11,.8);border:1px solid var(--border);color:var(--dim);padding:8px 20px;border-radius:6px;font-weight:500;cursor:pointer;transition:all .4s var(--ease);white-space:nowrap}
.tab:hover{border-color:var(--brass-muted);color:var(--text)}
.tab.active{background:var(--metal);border-color:transparent;color:#1b110a;font-weight:600}

.container{max-width:1600px;margin:0 auto;padding:24px 40px 100px}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .5s var(--ease)}
.card:hover{border-color:var(--brass-muted);transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.6),0 0 22px var(--glow);background:rgba(42,28,18,.9)}
.card[hidden]{display:none}
.thumb{aspect-ratio:4/3;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;filter:sepia(12%) saturate(95%);transition:opacity .8s,transform 1s var(--ease),filter .5s}
.thumb img.ready{opacity:1}
.card:hover .thumb img{transform:scale(1.05);filter:none}
.info{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1;background:
  radial-gradient(circle at 10px calc(100% - 10px),var(--brass-muted) 1.5px,transparent 2px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),var(--brass-muted) 1.5px,transparent 2px)}
.plate{align-self:flex-start;background:var(--metal);color:#1b110a;font:600 11px var(--sans);padding:2px 10px;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 1px 4px rgba(0,0,0,.5)}
.name{margin:0;font:400 16px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:16px;margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.act{background:none;border:0;padding:0;color:var(--dim);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:color .3s}
.act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.act:hover{color:var(--brass)}
.empty{grid-column:1/-1;text-align:center;padding:100px 20px;font:italic 24px var(--serif);color:var(--dim)}

dialog{border:0;padding:0;background:rgba(10,6,3,.96);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);width:100vw;max-width:100vw;height:100vh;max-height:100vh;color:var(--text)}
dialog[open]{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0}}
.lb{height:100%;display:flex;flex-direction:column;padding:20px 40px}
.lb-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}
#lb-title{font:500 20px var(--serif);color:var(--brass);margin:0}
#lb-count{font-size:13px;color:var(--dim)}
.round{background:rgba(32,21,14,.85);border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:all .3s}
.lb-close{width:40px;height:40px;color:var(--text)}
.lb-close:hover{border-color:var(--brass);color:var(--brass)}
.lb-close svg{width:20px;height:20px}
.stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;min-height:0}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.9),0 0 0 1px var(--border)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:var(--brass);width:50px;height:50px}
.lb-nav:hover{background:var(--brass);color:var(--bg)}
.lb-nav.prev{left:0}.lb-nav.next{right:0}
.lb svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lb-nav svg{width:24px;height:24px}

#toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,20px);background:var(--metal);color:#1b110a;padding:12px 28px;border-radius:6px;font:600 14px var(--sans);box-shadow:0 10px 30px var(--glow);opacity:0;pointer-events:none;transition:all .5s var(--ease);z-index:1000}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:768px){
  .hero-stats{gap:28px}
  .nav-inner,.utility,.container{padding-inline:20px}
  .utility::after{left:20px;right:20px}
  #gallery{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .lb{padding:20px}
  .lb-nav{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *,::before,::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow"></div>

<div class="app">
  <nav><div class="nav-inner">
    <a href="#" class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#E0A458"/><circle cx="16" cy="16" r="10" fill="#1b110a"/><circle cx="16" cy="14" r="3" fill="#E0A458"/><path d="M14.5 15.6h3l1.2 6h-5.4z" fill="#E0A458"/><g fill="#1b110a"><circle cx="16" cy="2.9" r="1"/><circle cx="16" cy="29.1" r="1"/><circle cx="2.9" cy="16" r="1"/><circle cx="29.1" cy="16" r="1"/></g></svg>
      The Vault
    </a>
  </div></nav>

  <header class="hero">
    <svg class="wheel" id="wheel" viewBox="-120 -120 240 240" aria-hidden="true"></svg>
    <div class="hero-content">
      <h1 class="hero-title">The Vault</h1>
      <p class="hero-sub">Everything worth keeping, locked away and close at hand.</p>
      <div class="hero-stats">
        <div class="stat"><b id="stat-total">0</b><span>Items</span></div>
        <div class="stat"><b id="stat-folders">0</b><span>Drawers</span></div>
      </div>
    </div>
  </header>

  <div class="rail"></div>

  <div class="utility">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Search the vault..." autocomplete="off" aria-label="Search the vault">
    </div>
  </div>

  <main class="container"><div id="gallery"></div></main>
</div>

<dialog id="lightbox">
  <div class="lb">
    <div class="lb-head">
      <div><h3 id="lb-title"></h3><span id="lb-count"></span></div>
      <button class="round lb-close" id="lb-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="stage">
      <button class="round lb-nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img id="lb-img" alt="">
      <button class="round lb-nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
/* ---------- Vault door background ----------
   Brushed bronze plate: horizontal hairline streaks, bolted panel seams, rivets.
   Seeded, so it looks identical on every load. Rendered once per width change. */
(() => {
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const rng = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function rivet(x, y) {
    const g = ctx.createRadialGradient(x - 1.5, y - 1.5, .5, x, y, 5.5);
    g.addColorStop(0, '#d9a766'); g.addColorStop(.45, '#6b4524'); g.addColorStop(1, '#1a0f08');
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(x + 1, y + 1.5, 6, 0, 7); ctx.fill();
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
  }

  function draw() {
    const w = cv.width = innerWidth, h = cv.height = innerHeight, r = rng(7);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#2a1a10'); g.addColorStop(.5, '#1a110a'); g.addColorStop(1, '#0f0a06');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    for (let i = w * h / 140; i--;) { // brushed streaks
      const a = r() * .06, light = r() < .55;
      ctx.fillStyle = light ? `rgba(255,214,160,${a})` : `rgba(0,0,0,${a * 2})`;
      ctx.fillRect(r() * w, r() * h, 40 + r() * 520, 1);
    }

    const P = Math.max(340, w / 4);
    for (let x = P; x < w; x += P) { // vertical seams
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 1, 0, 3, h);
      ctx.fillStyle = 'rgba(255,214,160,.08)'; ctx.fillRect(x + 2, 0, 1, h);
    }
    for (let y = P; y < h; y += P) { // horizontal seams
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, y - 1, w, 3);
      ctx.fillStyle = 'rgba(255,214,160,.08)'; ctx.fillRect(0, y + 2, w, 1);
    }
    for (let cx = 0; cx < w; cx += P) for (let cy = 0; cy < h; cy += P) // rivets in every panel corner
      for (const [dx, dy] of [[24, 24], [P - 24, 24], [24, P - 24], [P - 24, P - 24]]) rivet(cx + dx, cy + dy);
  }

  let w0 = innerWidth, timer;
  draw();
  addEventListener('resize', () => {
    if (innerWidth === w0) return; // ignore mobile URL-bar height changes
    w0 = innerWidth; clearTimeout(timer); timer = setTimeout(draw, 250);
  });
})();

/* ---------- Vault wheel (turns slowly as you scroll) ---------- */
(() => {
  const wheel = document.getElementById('wheel');
  const pt = (a, r) => [(Math.sin(a) * r).toFixed(2), (-Math.cos(a) * r).toFixed(2)];
  let s = '<circle r="112" stroke-width="2.5"/><circle r="100" stroke-width="1"/><circle r="64" stroke-width="2"/><circle r="22" stroke-width="3"/><circle r="8" stroke-width="2"/>';
  for (let i = 0; i < 60; i++) { // dial ticks
    const a = i * Math.PI / 30, [x1, y1] = pt(a, 100), [x2, y2] = pt(a, i % 5 ? 105 : 110);
    s += `<path d="M${x1} ${y1}L${x2} ${y2}" stroke-width="${i % 5 ? .8 : 1.6}"/>`;
  }
  for (let i = 0; i < 6; i++) { // spokes with knobs
    const a = i * Math.PI / 3, [x1, y1] = pt(a, 22), [x2, y2] = pt(a, 64), [kx, ky] = pt(a, 82);
    s += `<path d="M${x1} ${y1}L${x2} ${y2}" stroke-width="7" stroke-linecap="round"/><circle cx="${kx}" cy="${ky}" r="10" stroke-width="2.5"/>`;
  }
  wheel.innerHTML = s;

  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let tick = 0;
  addEventListener('scroll', () => {
    tick = tick || requestAnimationFrame(() => { wheel.style.transform = `rotate(${scrollY * .1}deg)`; tick = 0; });
  }, { passive: true });
})();

/* ---------- Gallery ---------- */
/* Point these at the GitHub repo (GitHub Pages enabled) that holds your images */
const USER = "darkskullslayer1991", REPO = "Online-links", BRANCH = "main";
const BASE = `https://${USER}.github.io/${REPO}/`;
const IMG_RE = /\.(jpe?g|png|gif|webp|avif|svg|bmp)$/i;
const ICON = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>'
};

const $ = id => document.getElementById(id);
const gallery = $("gallery"), search = $("search"), tabs = $("tabs"),
      lightbox = $("lightbox"), lbImg = $("lb-img"), toast = $("toast");
let items = [], view = [], folder = "All", current = 0, toastTimer;

const urlFor = p => BASE + p.split("/").map(encodeURIComponent).join("/");
const el = (tag, cls, html) => Object.assign(document.createElement(tag), { className: cls || "", innerHTML: html || "" });

function say(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

async function copyURL(path) {
  try { await navigator.clipboard.writeText(urlFor(path)); say("Link copied"); }
  catch { prompt("Copy this link:", urlFor(path)); }
}

async function load() {
  try {
    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`);
    if (!res.ok) throw new Error("Couldn't open the vault. Check the repository name and branch.");
    const { tree } = await res.json();
    items = tree.filter(f => f.type === "blob" && IMG_RE.test(f.path)).map(f => {
      const parts = f.path.split("/"), name = parts.pop();
      return { path: f.path, name, dir: parts.join("/") || "Vault", top: parts[0] || "Vault", url: urlFor(f.path) };
    });
    buildTabs();
    buildCards();
    filter();
  } catch (e) {
    gallery.replaceChildren(Object.assign(el("div", "empty"), { textContent: e.message }));
  }
}

function buildTabs() {
  const set = new Set(items.map(f => f.top));
  $("stat-total").textContent = items.length;
  $("stat-folders").textContent = set.size;
  tabs.replaceChildren(...["All", ...[...set].sort()].map(name => {
    const b = el("button", "tab" + (name === folder ? " active" : ""));
    b.textContent = b.dataset.f = name;
    return b;
  }));
}

function buildCards() {
  const frag = document.createDocumentFragment();
  for (const f of items) {
    const card = f.el = el("article", "card");
    card._f = f;
    const thumb = el("div", "thumb"), img = new Image();
    img.loading = "lazy"; img.decoding = "async"; img.alt = f.name;
    img.onload = () => img.classList.add("ready");
    img.src = f.url;
    thumb.append(img);

    const info = el("div", "info", `<span class="plate"></span><h3 class="name"></h3>
      <div class="actions"><button class="act" data-copy>${ICON.copy} Copy link</button>
      <a class="act" target="_blank" rel="noopener">${ICON.link} Open</a></div>`);
    info.children[0].textContent = f.dir;
    info.children[1].textContent = info.children[1].title = f.name;
    info.querySelector("a").href = f.url;

    card.append(thumb, info);
    frag.append(card);
  }
  const empty = el("div", "empty", "Nothing in here matches.");
  empty.hidden = true;
  gallery.replaceChildren(frag, empty);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  view = items.filter(f => (folder === "All" || f.top === folder) && f.path.toLowerCase().includes(q));
  const shown = new Set(view);
  for (const f of items) f.el.hidden = !shown.has(f);
  gallery.lastElementChild.hidden = view.length > 0;
}

function showAt(i) {
  if (!view.length) return;
  current = (i + view.length) % view.length;
  const f = view[current];
  lbImg.src = f.url;
  lbImg.alt = f.name;
  $("lb-title").textContent = f.name;
  $("lb-count").textContent = `${current + 1} of ${view.length}`;
}

tabs.onclick = e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  folder = b.dataset.f;
  tabs.querySelector(".active").classList.remove("active");
  b.classList.add("active");
  filter();
};

gallery.onclick = e => {
  const card = e.target.closest(".card");
  if (!card) return;
  if (e.target.closest("[data-copy]")) copyURL(card._f.path);
  else if (e.target.closest(".thumb")) { showAt(view.indexOf(card._f)); lightbox.showModal(); }
};

$("prev").onclick = () => showAt(current - 1);
$("next").onclick = () => showAt(current + 1);
$("lb-close").onclick = () => lightbox.close();
lightbox.onclick = e => { if (e.target === lightbox || e.target.classList.contains("stage")) lightbox.close(); };
lightbox.onclose = () => lbImg.removeAttribute("src");
addEventListener("keydown", e => {
  if (!lightbox.open) return;
  if (e.key === "ArrowLeft") showAt(current - 1);
  else if (e.key === "ArrowRight") showAt(current + 1);
});
search.oninput = filter;

load();
</script>
</body>
</html>
