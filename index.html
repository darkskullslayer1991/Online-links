<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Image Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314191c'/%3E%3Crect x='14' y='14' width='22' height='30' rx='5' fill='%239fc5b0'/%3E%3Crect x='30' y='24' width='22' height='26' rx='5' fill='%23e8b383'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Figtree:wght@400..600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14191c;
    --raised: #1b2227;
    --line: #2b343a;
    --paper: #e9e6dd;
    --muted: #8d999c;
    --sage: #9fc5b0;
    --apricot: #e8b383;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", "Segoe UI", Arial, sans-serif;
    --col: 250px;
    --gap: 18px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; color-scheme: dark; }
  ::selection { background: color-mix(in srgb, var(--sage) 35%, transparent); }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 12% -80px, color-mix(in srgb, var(--sage) 9%, transparent), transparent 70%),
      radial-gradient(700px 380px at 92% -120px, color-mix(in srgb, var(--apricot) 7%, transparent), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--paper);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Calm, thin scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 2px solid var(--bg); }

  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 48px); }

  /* ---------- Hero ---------- */
  header { padding: clamp(44px, 8vw, 96px) 0 clamp(32px, 5vw, 56px); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 40px; align-items: center; }

  h1 {
    margin: 0; font-family: var(--serif); font-weight: 450;
    font-size: clamp(46px, 8vw, 96px); line-height: .96; letter-spacing: -0.025em;
    font-variation-settings: "opsz" 144;
  }

  #status { margin: 22px 0 0; max-width: 34ch; color: var(--paper); opacity: .78; font: italic 400 clamp(20px, 2.2vw, 26px)/1.3 var(--serif); }

  .facts { list-style: none; margin: 24px 0 0; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .facts li {
    display: flex; align-items: center; gap: 8px; padding: 6px 15px 6px 12px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--muted);
    background: color-mix(in srgb, var(--raised) 60%, transparent);
  }
  .facts i { width: 8px; height: 8px; border-radius: 50%; }
  .facts b { color: var(--paper); font-weight: 600; }

  .how { list-style: none; margin: 34px 0 0; padding: 0; display: grid; gap: 12px; }
  .how li { display: flex; align-items: center; gap: 13px; font-size: 15px; }
  .how span {
    flex: none; width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 10px; background: var(--raised); border: 1px solid var(--line);
  }
  .how svg { width: 16px; height: 16px; stroke: var(--sage); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* A hand-laid stack of prints, made from your own library */
  .stack { position: relative; height: 390px; width: 100%; max-width: 480px; justify-self: end; }
  .tile {
    position: absolute; left: var(--x); top: var(--y); rotate: var(--r);
    width: 45%; aspect-ratio: 4 / 5; object-fit: cover; display: block;
    border: 6px solid var(--paper); border-radius: 14px; background: var(--raised);
    box-shadow: 0 22px 44px rgba(0,0,0,.38);
    animation: settle .9s cubic-bezier(.2,.8,.2,1) backwards;
    animation-delay: calc(var(--i) * 110ms);
    transition: translate .35s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover { translate: 0 -8px; z-index: 2; }
  .tile:nth-child(1) { --x: 0%;  --y: 14%; --r: -6deg; }
  .tile:nth-child(2) { --x: 29%; --y: 0%;  --r: 3deg; }
  .tile:nth-child(3) { --x: 55%; --y: 20%; --r: 7deg; }
  .tile:nth-child(4) { --x: 22%; --y: 46%; --r: -2deg; }
  @keyframes settle { from { opacity: 0; translate: 0 36px; rotate: 0deg; } }

  /* ---------- Bar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
    border-block: 1px solid var(--line);
  }
  .bar .wrap { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }

  .search { position: relative; flex: 1 1 280px; max-width: 440px; }
  .search svg {
    position: absolute; left: 15px; top: 50%; translate: 0 -50%; width: 18px; height: 18px;
    stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; pointer-events: none; transition: stroke .2s;
  }
  .search:focus-within svg { stroke: var(--sage); }
  #search {
    width: 100%; height: 46px; padding: 0 44px 0 44px; border-radius: 13px;
    background: var(--raised); border: 1px solid var(--line); color: var(--paper);
    font: inherit; font-size: 16px; transition: border-color .2s, box-shadow .2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sage) 16%, transparent); }
  #search::-webkit-search-cancel-button { display: none; }
  .hint {
    position: absolute; right: 12px; top: 50%; translate: 0 -50%; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; pointer-events: none;
  }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; border-radius: 13px; background: var(--raised); border: 1px solid var(--line); }
  .tab {
    height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: none;
    color: var(--muted); font: 500 15px var(--sans); cursor: pointer; transition: color .2s, background .2s;
  }
  .tab sup { font-size: 11px; margin-left: 5px; opacity: .75; }
  .tab:hover { color: var(--paper); }
  .tab[aria-pressed="true"] { color: var(--paper); background: color-mix(in srgb, var(--sage) 24%, var(--bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sage) 45%, transparent); }

  .size { display: flex; align-items: center; gap: 10px; margin-left: auto; color: var(--muted); }
  .size svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .size svg:last-child { width: 20px; height: 20px; }
  .size input { width: 120px; accent-color: var(--sage); }

  /* ---------- Gallery (masonry keeps true proportions) ---------- */
  main { padding: clamp(24px, 3vw, 40px) 0 120px; }

  #gallery { column-width: var(--col); column-gap: var(--gap); }

  figure {
    position: relative; margin: 0 0 var(--gap);
    break-inside: avoid;
    border-radius: 12px; overflow: hidden;
    background: var(--raised);
  }

  .frame {
    display: block; width: 100%; padding: 0; border: 0; background: none;
    cursor: zoom-in; line-height: 0;
  }
  .frame img {
    width: 100%; height: auto; display: block;
    opacity: 0; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .frame img.ready { opacity: 1; }
  figure:hover .frame img.ready { transform: scale(1.025); }

  /* Tiny placeholder height while an image is still loading */
  .loading { min-height: 140px; }

  .cap {
    position: absolute; inset: auto 0 0 0; padding: 38px 12px 11px 14px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    background: linear-gradient(to top, rgba(10,13,15,.84), rgba(10,13,15,0));
    opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  figure:hover .cap, figure:focus-within .cap { opacity: 1; }
  @media (hover: none) { .cap { opacity: 1; } }

  .cap-text { min-width: 0; line-height: 1.25; }
  .cap-name {
    font-size: 13.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cap-folder { font-size: 12px; color: var(--sage); }

  .cap-actions { display: flex; gap: 6px; pointer-events: auto; flex: none; }

  .icon {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid rgba(233,230,221,.18);
    background: rgba(233,230,221,.12); color: var(--paper); cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .2s, color .2s, transform .2s;
  }
  .icon:hover { background: var(--sage); color: #10201a; transform: translateY(-1px); }
  .icon.ok { background: var(--apricot); color: #2d1b0b; }
  .icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .empty {
    column-span: all; padding: 90px 0; text-align: center; color: var(--muted);
    font: italic 400 24px var(--serif);
  }

  /* ---------- Lightbox ---------- */
  dialog {
    border: 0; padding: 0; background: transparent; color: var(--paper);
    width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh;
  }
  dialog::backdrop { background: rgba(10,13,15,.93); backdrop-filter: blur(10px); }

  .lb { height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 22px clamp(14px, 4vw, 56px) 22px; gap: 16px; }

  .lb-stage { position: relative; min-height: 0; display: grid; place-items: center; }
  .lb-stage img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }

  .nav {
    position: absolute; top: 50%; translate: 0 -50%;
    width: 48px; height: 48px;
  }
  .nav.prev { left: -8px; } .nav.next { right: -8px; }
  .nav svg { width: 20px; height: 20px; }

  .lb-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .lb-name { margin: 0; font: italic 400 22px/1.25 var(--serif); overflow-wrap: anywhere; }
  .lb-count { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--raised); color: var(--paper); font: 500 14px var(--sans); cursor: pointer;
    transition: background .2s, border-color .2s, color .2s;
  }
  .pill:hover { border-color: var(--sage); }
  .pill.main { background: var(--sage); border-color: var(--sage); color: #10201a; }
  .pill.main:hover { background: #b4d6c2; }
  .pill.ok { background: var(--apricot); border-color: var(--apricot); color: #2d1b0b; }
  .pill svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .lb-actions { display: flex; gap: 10px; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 50;
    translate: -50% 20px; opacity: 0; pointer-events: none;
    background: var(--paper); color: #1a1f22; padding: 11px 20px; border-radius: 999px;
    font-weight: 500; font-size: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    transition: opacity .25s, translate .3s cubic-bezier(.2,.8,.2,1);
  }
  #toast.show { opacity: 1; translate: -50% 0; }

  /* ---------- Quality floor ---------- */
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; border-radius: 6px; }
  .icon:focus-visible { border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation: none !important; scroll-behavior: auto !important; }
  }

  @media (max-width: 640px) {
    :root { --col: 150px; --gap: 12px; }
    .size, .hint, .stack { display: none; }
    .hero { grid-template-columns: 1fr; }
    .nav { width: 40px; height: 40px; }
    .nav.prev { left: 0; } .nav.next { right: 0; }
  }
</style>
</head>

<body>

<header>
  <div class="wrap hero">
    <div>
      <h1>My Image Library</h1>
      <p id="status">Gathering your images…</p>
      <ul class="facts" id="facts"></ul>
      <ul class="how">
        <li><span><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></span>Hover an image to copy its link</li>
        <li><span><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span>Click it to view full screen</li>
        <li><span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>Press / to search by name</li>
      </ul>
    </div>
    <div class="stack" id="stack" aria-hidden="true"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search your library" autocomplete="off" aria-label="Search images and GIFs">
      <span class="hint" aria-hidden="true">/</span>
    </label>
    <div class="tabs" id="tabs" role="group" aria-label="Filter by folder"></div>
    <label class="size" title="Thumbnail size">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <input id="size" type="range" min="150" max="420" step="10" value="250" aria-label="Thumbnail size">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
    </label>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="gallery"></div>
  </div>
</main>

<dialog id="lightbox" aria-label="Image preview">
  <div class="lb">
    <div class="lb-stage">
      <button class="icon nav prev" id="prev" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <img id="lbImg" alt="">
      <button class="icon nav next" id="next" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="lb-foot">
      <div>
        <p class="lb-name" id="lbName"></p>
        <div class="lb-count" id="lbCount"></div>
      </div>
      <div class="lb-actions">
        <button class="pill main" id="lbCopy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg><span>Copy link</span></button>
        <button class="pill" id="lbClose">Close</button>
      </div>
    </div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>

// CHANGE THESE THREE VALUES
const USERNAME = "darkskullslayer1991";
const REPOSITORY = "Online-links";
const BRANCH = "main";

// GitHub Pages address
const BASE_URL = `https://${USERNAME}.github.io/${REPOSITORY}/`;

// Supported image formats
const EXTENSIONS = /\.(jpg|jpeg|png|gif|webp|avif|svg|bmp)$/i;

const $ = id => document.getElementById(id);
const gallery = $("gallery"), statusEl = $("status"), search = $("search"),
      tabsEl = $("tabs"), lightbox = $("lightbox"), toast = $("toast"), size = $("size");

const ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>';
const ICON_OPEN = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

let items = [], view = [], activeFolder = "All", current = 0, toastTimer;

const urlFor = p => BASE_URL + p.split("/").map(encodeURIComponent).join("/");
const folderOf = p => p.includes("/") ? p.split("/")[0] : "Root";

function say(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

async function copyLink(path, btn, idleHTML) {
  try {
    await navigator.clipboard.writeText(urlFor(path));
    say("Link copied");
    btn.classList.add("ok");
    btn.innerHTML = btn.classList.contains("pill") ? ICON_OK + "<span>Copied</span>" : ICON_OK;
    setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = idleHTML; }, 1500);
  } catch {
    window.prompt("Copy this URL:", urlFor(path));
  }
}

async function loadImages() {
  try {
    const api = `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
    const response = await fetch(api);
    if (!response.ok) throw new Error(`Could not access repository (HTTP ${response.status}).`);
    const data = await response.json();
    if (data.truncated) throw new Error("Repository is too large to scan completely.");
    items = data.tree.filter(f => f.type === "blob" && EXTENSIONS.test(f.path));
    renderTabs();
    renderHero();
    renderGallery();
  } catch (error) {
    statusEl.textContent = error.message;
  }
}

function renderTabs() {
  const counts = {};
  items.forEach(f => { const k = folderOf(f.path); counts[k] = (counts[k] || 0) + 1; });
  tabsEl.innerHTML = "";
  ["All", ...Object.keys(counts).sort()].forEach(name => {
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("aria-pressed", String(name === activeFolder));
    b.innerHTML = `${name}<sup>${name === "All" ? items.length : counts[name]}</sup>`;
    b.onclick = () => { activeFolder = name; renderTabs(); renderGallery(); };
    tabsEl.appendChild(b);
  });
}

function renderHero() {
  const gifs = items.filter(f => /\.gif$/i.test(f.path)).length;
  const folders = new Set(items.map(f => folderOf(f.path))).size;
  $("facts").innerHTML = [["sage", items.length - gifs, "image"], ["apricot", gifs, "GIF"], ["paper", folders, "folder"]]
    .filter(f => f[1])
    .map(([c, n, w]) => `<li><i style="background:var(--${c})"></i><b>${n}</b> ${w}${n === 1 ? "" : "s"}</li>`).join("");
  const n = Math.min(4, items.length);
  $("stack").innerHTML = Array.from({ length: n }, (_, k) => items[Math.floor(k * items.length / n)])
    .map((f, k) => `<img class="tile" style="--i:${k}" src="${urlFor(f.path)}" alt="">`).join("");
}

function iconBtn(label, html, onclick) {
  const b = document.createElement("button");
  b.className = "icon"; b.type = "button";
  b.setAttribute("aria-label", label); b.title = label;
  b.innerHTML = html; b.onclick = onclick;
  return b;
}

function renderGallery() {
  const q = search.value.trim().toLowerCase();
  view = items.filter(f =>
    (activeFolder === "All" || folderOf(f.path) === activeFolder) &&
    f.path.toLowerCase().includes(q));

  statusEl.textContent = !items.length
    ? "No images found in this repository yet."
    : (q || activeFolder !== "All")
      ? `Showing ${view.length} of ${items.length}.`
      : "Every image and GIF you've saved, one click from a shareable link.";

  gallery.innerHTML = "";
  if (!view.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing matches that search.";
    gallery.appendChild(e);
    return;
  }

  view.forEach((file, i) => {
    const parts = file.path.split("/"), base = parts.pop();

    const fig = document.createElement("figure");
    fig.className = "loading";

    const frame = document.createElement("button");
    frame.className = "frame"; frame.type = "button";
    frame.setAttribute("aria-label", `Preview ${file.path}`);
    const img = document.createElement("img");
    img.alt = file.path; img.loading = "lazy"; img.decoding = "async";
    const done = () => { img.classList.add("ready"); fig.classList.remove("loading"); };
    img.onload = done; img.onerror = done;
    img.src = urlFor(file.path);
    frame.appendChild(img);
    frame.onclick = () => openLightbox(i);

    const cap = document.createElement("div");
    cap.className = "cap";
    const text = document.createElement("div");
    text.className = "cap-text";
    text.innerHTML = '<div class="cap-name"></div>' + (parts.length ? '<div class="cap-folder"></div>' : "");
    text.firstChild.textContent = base;
    if (parts.length) text.lastChild.textContent = parts.join("/");

    const actions = document.createElement("div");
    actions.className = "cap-actions";
    const copy = iconBtn("Copy link", ICON_COPY, () => copyLink(file.path, copy, ICON_COPY));
    const open = iconBtn("Open in new tab", ICON_OPEN, () => window.open(urlFor(file.path), "_blank", "noopener"));
    actions.append(copy, open);

    cap.append(text, actions);
    fig.append(frame, cap);
    gallery.appendChild(fig);
  });
}

/* ---------- Lightbox ---------- */
const lbCopy = $("lbCopy"), COPY_HTML = lbCopy.innerHTML;

function showAt(i) {
  if (!view.length) return;
  current = (i + view.length) % view.length;
  const f = view[current];
  $("lbImg").src = urlFor(f.path);
  $("lbImg").alt = f.path;
  $("lbName").textContent = f.path;
  $("lbCount").textContent = `${current + 1} of ${view.length}`;
  lbCopy.onclick = () => copyLink(f.path, lbCopy, COPY_HTML);
}

function openLightbox(i) { showAt(i); lightbox.showModal(); }

$("prev").onclick = () => showAt(current - 1);
$("next").onclick = () => showAt(current + 1);
$("lbClose").onclick = () => lightbox.close();
lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target.classList.contains("lb-stage")) lightbox.close(); });
lightbox.addEventListener("close", () => { $("lbImg").removeAttribute("src"); });

document.addEventListener("keydown", e => {
  if (lightbox.open) {
    if (e.key === "ArrowLeft") showAt(current - 1);
    if (e.key === "ArrowRight") showAt(current + 1);
  } else if (e.key === "/" && document.activeElement !== search) {
    e.preventDefault(); search.focus();
  }
});

/* ---------- Controls ---------- */
search.addEventListener("input", renderGallery);

const applySize = v => document.documentElement.style.setProperty("--col", v + "px");
try { const s = localStorage.getItem("thumbSize"); if (s) { size.value = s; applySize(s); } } catch {}
size.addEventListener("input", () => {
  applySize(size.value);
  try { localStorage.setItem("thumbSize", size.value); } catch {}
});

loadImages();

</script>
</body>
</html>
